name: Collect Traffic Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector script
        env:
          TOMTOM_API_KEY_1: ${{ secrets.TOMTOM_API_KEY_1 }}
          TOMTOM_API_KEY_2: ${{ secrets.TOMTOM_API_KEY_2 }}
          TOMTOM_API_KEY_3: ${{ secrets.TOMTOM_API_KEY_3 }}
        run: python collect_traffic.py

      - name: Commit and push CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add realtime_traffic_data.csv
          git diff --staged --quiet || git commit -m "Add traffic data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
